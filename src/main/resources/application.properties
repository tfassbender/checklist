# Server configuration
quarkus.http.port=4715

# Application name
quarkus.application.name=checklist

# Data storage directory
checklist.data.dir=../../../../data

# JWT Configuration
# The signing key is base64-encoded (32 bytes / 256 bits for HS256).
# IMPORTANT: For production deployment, generate a new secure key and store it in environment
# variables or a secrets manager. Never commit production keys to version control!
mp.jwt.verify.issuer=checklist-app
smallrye.jwt.sign.key=X8ks92Hd7fJkL3nMp5qRsT9vWxYz1234AbCdEfGhIjK=
smallrye.jwt.verify.key.location=jwt-secret.jwk
smallrye.jwt.verify.algorithm=HS256

# Custom JWT settings
jwt.expiration.hours=24

# CORS Configuration (for development)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4715
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Authorization

# Serve static files
quarkus.http.enable-compression=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."net.tfassbender.checklist".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Development mode settings
%dev.quarkus.http.port=4715
%dev.quarkus.log.console.enable=true
